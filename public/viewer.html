<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Canlı Yayın – İzleyici</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>📺 Canlı Yayın</h1>
    </div>

    <!-- Yükleniyor / Hata Durumu -->
    <div id="waiting-section" class="card" style="text-align:center;">
      <div id="loading-spinner" class="spinner"></div>
      <p id="status-msg" class="status-msg">Yayına bağlanılıyor...</p>
    </div>

    <!-- Video Ekranı -->
    <div id="video-section" style="display:none;">
      <div class="video-wrapper" id="video-wrapper">
        <video id="remote-video" playsinline></video>
        <div class="live-badge">🔴 CANLI</div>
        <!-- Ses engeli overlay -->
        <div id="unmute-overlay">
          <button id="unmute-btn">🔊 Sesi Aç &amp; Başlat</button>
        </div>
        <!-- Uzaktan kontrol yakalama katmanı (fare olayları için) -->
        <div id="control-overlay" class="control-overlay" style="display:none;"></div>
      </div>

      <!-- Uzaktan Kontrol Çubuğu -->
      <div class="control-bar" id="control-bar">
        <button id="request-control-btn" class="btn btn-secondary">🎮 Kontrol İste</button>
        <button id="release-control-btn" class="btn btn-danger" style="display:none;">🚫 Kontrolü Bırak</button>
        <span id="control-status" class="control-status" style="display:none;"></span>
        <button id="fullscreen-btn" class="btn btn-secondary" title="Tam Ekran">⛶ Tam Ekran</button>
      </div>

      <!-- Chat -->
      <div class="chat-box card">
        <div class="chat-header">
          <span>💬 Canlı Sohbet</span>
          <span class="chat-badge" id="chat-badge" style="display:none"></span>
        </div>
        <div class="chat-messages" id="chat-messages"></div>
        <div class="chat-input-row">
          <input id="chat-name" type="text" maxlength="30" placeholder="Adınız" class="chat-name-input" />
          <input id="chat-input" type="text" maxlength="500" placeholder="Mesaj yazın..." />
          <button id="chat-send" class="btn btn-primary">➜</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/config.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="chat.js"></script>
  <script src="viewer.js"></script>
</body>
</html>
